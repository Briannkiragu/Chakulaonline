<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f8fa; font-family:Arial, sans-serif; color:#33475B;">
    <div style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:8px; overflow:hidden;">
        <div style="background:#C33332; padding:20px; text-align:center; color:#ffffff; font-size:24px; font-weight:bold;">
            FoodOnline
        </div>
        <div style="padding:30px;">
            <h2 style="margin-top:0;">Reset Your Password</h2>
            <p>Hi {{ user.first_name }},</p>
            <p>Please click the button below to reset your password.</p>
            <p style="text-align:center; margin:30px 0;">
                <a href="http://{{domain}}{% url 'reset_password_validate' uidb64=uid token=token %}" style="display:inline-block; background:#C33332; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:5px; font-weight:bold;">
                    Reset Password
                </a>
            </p>
            <p>If the button does not work, use this link:</p>
            <p><a href="http://{{domain}}{% url 'reset_password_validate' uidb64=uid token=token %}">http://{{domain}}{% url 'reset_password_validate' uidb64=uid token=token %}</a></p>
        </div>
    </div>
</body>
</html>
